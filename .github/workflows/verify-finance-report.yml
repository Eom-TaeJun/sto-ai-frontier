name: Verify finance report
on:
  push:
    branches: [main]
    paths:
      - 'reports/digital-finance-agentic-securities.html'
      - '.github/workflows/verify-finance-report.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Run existing project checks
        run: |
          python run.py
          python -m unittest discover -s tests -v
      - name: Install browser test dependencies
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Check report and public preview
        run: |
          python - <<'PY'
          import json
          import pathlib
          from html.parser import HTMLParser
          from playwright.sync_api import sync_playwright
          path = pathlib.Path('reports/digital-finance-agentic-securities.html')
          content = path.read_text(encoding='utf-8')
          class Audit(HTMLParser):
              def __init__(self):
                  super().__init__(); self.ids = []; self.links = []
              def handle_starttag(self, tag, attrs):
                  a = dict(attrs)
                  if 'id' in a: self.ids.append(a['id'])
                  if tag == 'a' and a.get('href', '').startswith('#'): self.links.append(a['href'][1:])
          audit = Audit(); audit.feed(content)
          assert len(audit.ids) == len(set(audit.ids)), 'Duplicate IDs'
          assert all(x in audit.ids for x in audit.links), 'Broken local links'
          assert 'noindex' in content
          out = pathlib.Path('report-preview-check'); out.mkdir(exist_ok=True)
          remote = 'https://htmlpreview.github.io/?https://raw.githubusercontent.com/Eom-TaeJun/sto-ai-frontier/main/reports/digital-finance-agentic-securities.html'
          result = {'url': remote, 'structure': 'passed', 'local': [], 'remote': None}
          with sync_playwright() as p:
              browser = p.chromium.launch()
              for width in (1440, 390):
                  page = browser.new_page(viewport={'width': width, 'height': 960})
                  page.goto(path.resolve().as_uri())
                  page.locator('#kyobo').wait_for(state='attached')
                  overflow = page.evaluate('document.documentElement.scrollWidth > innerWidth')
                  assert not overflow, f'Page overflow at {width}'
                  page.screenshot(path=str(out / f'local-{width}.png'), full_page=False)
                  result['local'].append({'width': width, 'overflow': overflow, 'title': page.title()})
                  page.close()
              page = browser.new_page(viewport={'width': 1440, 'height': 960})
              try:
                  page.goto(remote, wait_until='domcontentloaded', timeout=60000)
                  page.locator('h1').filter(has_text='디지털 자산과 AI 에이전트').wait_for(timeout=60000)
                  assert page.locator('#kyobo').count() == 1
                  page.screenshot(path=str(out / 'public-preview.png'), full_page=False)
                  result['remote'] = {'status': 'passed', 'title': page.title(), 'body_chars': len(page.locator('body').inner_text())}
              except Exception as e:
                  result['remote'] = {'status': 'failed', 'error': str(e)}
              browser.close()
          (out / 'result.json').write_text(json.dumps(result, ensure_ascii=False, indent=2), encoding='utf-8')
          print(json.dumps(result, ensure_ascii=False, indent=2))
          assert result['remote']['status'] == 'passed', 'Public preview was not verified'
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: finance-report-preview-check
          path: report-preview-check/
          retention-days: 7
